<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        body {
            font-family: "Garamond", "Georgia", serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .container {
            max-width: 500px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: normal;
            margin-bottom: 40px;
            line-height: 1.4;
        }

        .btn-container {
            position: relative;
            height: 100px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        button {
            font-family: "Garamond", serif;
            font-size: 1.3rem;
            padding: 10px 35px;
            border: 1px solid #111111;
            background-color: #ffffff;
            color: #111111;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            min-width: 100px;
        }

        button:hover {
            background-color: #111111;
            color: #ffffff;
        }

        /* Kaçacak olan No butonu */
        #noBtn {
            position: absolute;
            transition: all 0.1s ease;
            z-index: 10;
        }

        #yesBtn {
            position: absolute;
            z-index: 5;
        }

        /* İkinci aşama mesaj ekranı */
        .message-screen {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 1. AŞAMA: Soru Ekranı -->
    <div class="container" id="questionContainer">
        <h1>Can you do me a favor?</h1>
        
        <div class="btn-container">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <!-- 2. AŞAMA: Net Mesaj Ekranı -->
    <div class="container message-screen" id="messageContainer">
        <h1>Beni engellemeni istiyorum.</h1>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionContainer = document.getElementById('questionContainer');
        const messageContainer = document.getElementById('messageContainer');

        // Butonların ilk konumları
        function initButtons() {
            yesBtn.style.left = 'calc(50% - 130px)';
            yesBtn.style.top = '25px';
            noBtn.style.left = 'calc(50% + 20px)';
            noBtn.style.top = '25px';
        }
        window.onload = initButtons;

        // "No" butonunun kaçma fonksiyonu
        function kac() {
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight - 40) + 20;
            
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        // Fareyle gelince kaç
        noBtn.addEventListener('mouseenter', kac);
        // Mobilde dokununca kaç
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            kac();
        });

        // "Yes" butonuna basınca ikinci ekranı aç
        yesBtn.addEventListener('click', () => {
            questionContainer.style.display = 'none';
            messageContainer.style.display = 'block';
        });
    </script>

</body>
</html>
