<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rümeysa Orhun</title>
    <style>
        /* Açık Tema Renkleri */
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --motto-color: #333333;
            --hover-color: #666666;
        }

        /* Karanlık Tema Renkleri */
        [data-theme="dark"] {
            --bg-color: #111111;
            --text-color: #f4f4f4;
            --motto-color: #aaaaaa;
            --hover-color: #cccccc;
        }

        body {
            font-family: "Garamond", "Georgia", serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 650px;
            margin: 100px auto;
            padding: 0 30px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }

        /* Gece Gündüz Butonu Tasarımı */
        .theme-toggle {
            position: absolute;
            top: -40px;
            right: 30px;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 1.1rem;
            color: var(--text-color);
            cursor: pointer;
            text-decoration: underline;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: normal;
            margin-bottom: 0px;
            display: inline-block;
        }
        .motto {
            font-style: italic;
            color: var(--motto-color);
            margin-top: 5px;
            margin-bottom: 35px;
        }
        .bio {
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
        .links a {
            color: var(--text-color);
            text-decoration: underline;
        }
        .links a:hover {
            color: var(--hover-color);
        }
        .section-title {
            margin-top: 45px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        ul {
            list-style-type: disc;
            padding-left: 20px;
            margin-top: 5px;
        }
        li {
            margin-bottom: 6px;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <!-- Gece Gündüz Değiştirme Butonu -->
    <button class="theme-toggle" id="theme-btn">dark</button>

    <h1>Rümeysa Orhun</h1>
    <p class="motto">CAN DO ANYTHING I WANT!</p>

    <p class="bio">yeah garamond is nice . i don't invest 😊</p>

    <p class="links">
        <a href="https://instagram.com" target="_blank">instagram</a>
    </p>

    <p class="section-title">currently watching:</p>
    <ul>
        <li>Muhteşem Yüzyıl (Magnificent Century)</li>
        <li>Lucifer</li>
        <li>Monster (have no idea why couldn't finish before)</li>
    </ul>

    <!-- Arka planda modu değiştiren sihirli kod (JavaScript) -->
    <script>
        const btn = document.getElementById('theme-btn');
        btn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                btn.textContent = 'dark';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                btn.textContent = 'light';
            }
        });
    </script>

</body>
</html>
