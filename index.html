<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>
    <style>
        body {
            font-family: "Garamond", "Georgia", serif;
            background-color: #ffffff;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-family: "Garamond", serif;
            font-size: 2.4rem;
            font-weight: normal;
            margin-bottom: 40px;
            line-height: 1.5;
        }

        .btn-container {
            position: relative;
            height: 150px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* İstediğiniz büyük ve kalın (bold) buton tasarımları */
        button {
            font-family: "Garamond", serif;
            font-size: 1.6rem;
            font-weight: bold;
            padding: 15px 45px;
            border: 2.5px solid #111111;
            background-color: #ffffff;
            color: #111111;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            min-width: 130px;
        }

        button:hover {
            background-color: #111111;
            color: #ffffff;
        }

        /* Sabit duran büyük Yes butonu */
        #yesBtn {
            position: absolute;
            left: calc(50% - 160px);
            top: 40px;
            z-index: 5;
        }

        /* Sınırlar içinde kaçacak olan büyük No butonu */
        #noBtn {
            position: absolute;
            left: calc(50% + 20px);
            top: 40px;
            transition: all 0.15s ease-out;
            z-index: 10;
        }

        .message-screen {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 1. AŞAMA: Giriş ve Soru Ekranı -->
    <div class="container" id="questionContainer">
        <h1>Welcome Benjamin Shi.<br>I'm Rümeysa Orhun. 😇<br>Would you do me a favor?</h1>
        
        <div class="btn-container">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <!-- 2. AŞAMA: Yes Butonuna Basınca Çıkacak Ekran -->
    <div class="container message-screen" id="messageContainer">
        <h1>Beni engellemeni istiyorum.</h1>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const questionContainer = document.getElementById('questionContainer');
        const messageContainer = document.getElementById('messageContainer');

        function kac() {
            // Ekranın orta %60'lık güvenli alan sınırları
            const paddingX = window.innerWidth * 0.2;
            const paddingY = window.innerHeight * 0.2;
            
            const minX = paddingX;
            const maxX = window.innerWidth - noBtn.offsetWidth - paddingX;
            const minY = paddingY;
            const maxY = window.innerHeight - noBtn.offsetHeight - paddingY;

            // Güvenli alan içinde rastgele koordinat üretme
            const randomX = Math.random() * (maxX - minX) + minX;
            const randomY = Math.random() * (maxY - minY) + minY;
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        // Fare yaklaştığında veya mobilde dokunulduğunda kaçış tetiklenir
        noBtn.addEventListener('mouseenter', kac);
        noBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            kac();
        });

        // "Yes" butonuna tıklandığında asıl mesaja geçiş yapar
        yesBtn.addEventListener('click', () => {
            questionContainer.style.display = 'none';
            messageContainer.style.display = 'block';
        });
    </script>

</body>
</html>
