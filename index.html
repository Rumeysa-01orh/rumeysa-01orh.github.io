<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benjamin & Rümeysa</title>
    <style>
        * {
            font-family: "Garamond", "Georgia", serif !important;
            box-sizing: border-box;
        }

        body {
            background-color: #f5f2eb;
            color: #111111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        /* Giriş Perdesi */
        #entryOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f5f2eb;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .container {
            max-width: 600px;
            width: 100%;
            z-index: 10;
        }

        .profile-img {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            object-fit: cover;
            border: 2.5px solid #111111;
            margin-bottom: 20px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            font-size: 2.4rem;
            font-weight: normal;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .subtitle {
            font-size: 1.6rem;
            font-style: italic;
            margin-bottom: 5px;
            color: #222222;
        }

        .btn-container {
            position: relative;
            height: 150px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            font-size: 1.6rem;
            font-weight: bold !important;
            padding: 15px 45px;
            border: 2.5px solid #111111;
            background-color: #f5f2eb;
            color: #111111;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
            min-width: 140px;
        }

        button:hover {
            background-color: #111111;
            color: #f5f2eb;
        }

        #yesBtn { position: absolute; left: calc(50% - 170px); top: 40px; z-index: 5; }
        #noBtn { position: absolute; left: calc(50% + 30px); top: 40px; transition: all 0.1s ease-out; z-index: 10; }

        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.5s ease forwards; }

        #countdownDisplay {
            font-size: 6rem;
            font-weight: bold;
        }

        .final-message {
            font-size: 2.8rem;
            font-weight: bold;
            line-height: 1.4;
            color: #cc2b2b !important; 
        }

        /* Konfeti Efekti */
        .confetti-piece {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            z-index: 99999;
            pointer-events: none;
            animation: fall linear forwards;
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(720deg);
                opacity: 0.8;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Giriş Perdesi -->
    <div id="entryOverlay">
        <button id="startPlayBtn">Open</button>
    </div>

    <!-- Joel Sunny - Codex Müziği (Klasördeki dosya adı ile eşleştirildi) -->
    <audio id="bgMusic" loop preload="auto">
        <source src="codex.mp3" type="audio/mpeg">
    </audio>

    <!-- EKRAN 1 -->
    <div class="container screen active" id="screen1">
        <img src="WhatsApp Image 2026-09-02 at 17.54.32.jpeg" class="profile-img" alt="Rümeysa Orhun">
        <div class="subtitle">Im Rümeysa</div>
        <h1>Welcome Benjamin Shi!</h1>
        <button id="nextBtn" style="position: static; margin-top: 20px;">Next</button>
    </div>

    <!-- EKRAN 2 -->
    <div class="container screen" id="screen2">
        <h1>Would you do me a favor?</h1>
        <div class="btn-container">
            <button id="yesBtn">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <!-- EKRAN 3 -->
    <div class="container screen" id="screen3">
        <div id="countdownDisplay">3</div>
    </div>

    <!-- EKRAN 4 -->
    <div class="container screen" id="screen4">
        <h1>...</h1>
        <button id="readyBtn" style="position: static;">Are you ready?</button>
    </div>

    <!-- EKRAN 5 -->
    <div class="container screen" id="screen5">
        <h1 class="final-message">I want u to delete my number and block me.</h1>
    </div>

    <script>
        const bgMusic = document.getElementById('bgMusic');
        const entryOverlay = document.getElementById('entryOverlay');
        const startPlayBtn = document.getElementById('startPlayBtn');
        
        const s1 = document.getElementById('screen1');
        const s2 = document.getElementById('screen2');
        const s3 = document.getElementById('screen3');
        const s4 = document.getElementById('screen4');
        const s5 = document.getElementById('screen5');

        const nextBtn = document.getElementById('nextBtn');
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const readyBtn = document.getElementById('readyBtn');
        const countdownDisplay = document.getElementById('countdownDisplay');

        // Müzik Başlatma
        startPlayBtn.addEventListener('click', () => {
            bgMusic.play().catch(err => console.log("Müzik yükleme/oynatma hatası:", err));
            entryOverlay.style.display = 'none';
        });

        nextBtn.addEventListener('click', () => {
            s1.classList.remove('active');
            s2.classList.add('active');
        });

        function noKac() {
            const paddingX = window.innerWidth * 0.25;
            const paddingY = window.innerHeight * 0.25;
            const minX = paddingX;
            const maxX = window.innerWidth - noBtn.offsetWidth - paddingX;
            const minY = paddingY;
            const maxY = window.innerHeight - noBtn.offsetHeight - paddingY;

            const randomX = Math.random() * (maxX - minX) + minX;
            const randomY = Math.random() * (maxY - minY) + minY;
            
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }
        noBtn.addEventListener('mouseenter', noKac);
        noBtn.addEventListener('touchstart', function(e) { e.preventDefault(); noKac(); });

        yesBtn.addEventListener('click', () => {
            s2.classList.remove('active');
            s3.classList.add('active');
            
            let count = 3;
            const timer = setInterval(() => {
                count--;
                if (count > 0) {
                    countdownDisplay.textContent = count;
                } else {
                    clearInterval(timer);
                    s3.classList.remove('active');
                    s4.classList.add('active');
                }
            }, 1000);
        });

        // Konfeti Yağmuru
        readyBtn.addEventListener('click', () => {
            s4.classList.remove('active');
            s5.classList.add('active');
            
            const colors = ['#f2d74e', '#e94a3f', '#3caea3', '#20639b', '#f6d55c', '#ed553b'];
            
            for (let i = 0; i < 120; i++) {
                setTimeout(() => {
                    const piece = document.createElement('div');
                    piece.classList.add('confetti-piece');
                    piece.style.left = Math.random() * 100 + 'vw';
                    piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.transform = 'scale(' + (Math.random() * 0.8 + 0.5) + ')';
                    piece.style.animationDuration = (Math.random() * 2 + 2.5) + 's';
                    document.body.appendChild(piece);
                    
                    setTimeout(() => { piece.remove(); }, 4500);
                }, i * 25);
            }
        });
    </script>

</body>
</html>
