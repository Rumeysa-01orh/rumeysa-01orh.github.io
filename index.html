<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rümeysa Orhun</title>
    <style>
        /* Açık Tema Renkleri */
        :root {
            --bg-color: #ffffff;
            --text-color: #111111;
            --motto-color: #333333;
            --hover-color: #666666;
        }

        /* Karanlık Tema Renkleri */
        [data-theme="dark"] {
            --bg-color: #111111;
            --text-color: #f4f4f4;
            --motto-color: #aaaaaa;
            --hover-color: #cccccc;
        }

        body {
            font-family: "Garamond", "Georgia", serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            max-width: 650px;
            margin: 100px auto;
            padding: 0 30px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }

        /* Ay ve Güneş Butonu Tasarımı */
        .theme-toggle {
            position: absolute;
            top: -40px;
            right: 30px;
            background: none;
            border: none;
            font-size: 1.3rem;
            cursor: pointer;
            padding: 5px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: normal;
            margin-bottom: 0px;
            display: inline-block;
        }
        .motto {
            font-style: italic;
            color: var(--motto-color);
            margin-top: 5px;
            margin-bottom: 35px;
        }
        .bio {
            margin-bottom: 25px;
            font-size: 1.1rem;
        }
        .links a {
            color: var(--text-color);
            text-decoration: underline;
        }
        .links a:hover {
            color: var(--hover-color);
        }
        .section-title {
            margin-top: 45px;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        ul {
            list-style-type: disc;
            padding-left: 20px;
            margin-top: 5px;
        }
        li {
            margin-bottom: 6px;
            font-size: 1.1rem;
        }

        /* Daktilo Efekti İçin Gizleme Ayarı */
        .typewriter {
            visibility: hidden;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- Ay / Güneş Değiştirme Butonu -->
    <button class="theme-toggle" id="theme-btn">🌙</button>

    <!-- Yazıların Tek Tek Gelmesi İçin Sınıflar Eklendi -->
    <h1 id="text-title" class="typewriter"></h1>
    <p id="text-motto" class="motto typewriter"></p>
    <p id="text-bio" class="bio typewriter"></p>
    
    <p id="text-links" class="links typewriter">
        <a href="https://instagram.com" target="_blank">instagram</a>
    </p>

    <p id="text-sectitle" class="section-title typewriter"></p>
    <ul id="text-list" class="typewriter" style="list-style-type: disc; padding-left: 20px;">
        <li>Muhteşem Yüzyıl (Magnificent Century)</li>
        <li>Lucifer</li>
        <li>Monster (have no idea why couldn't finish before)</li>
    </ul>

    <script>
        // Tema Değiştirme (Ay / Güneş) Sihirli Kodu
        const btn = document.getElementById('theme-btn');
        btn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.documentElement.removeAttribute('data-theme');
                btn.textContent = '🌙';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                btn.textContent = '☀️';
            }
        });

        // Yazıların Tek Tek Daktilo Gibi Yazılma Sihirli Kodu (JavaScript)
        function typeEffect(element, text, speed, callback) {
            element.style.visibility = 'visible';
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, speed);
                } else if (callback) {
                    callback();
                }
            }
            type();
        }

        function showElementImmediately(element, callback) {
            element.style.visibility = 'visible';
            if (callback) callback();
        }

        // Sayfa yüklenince sırayla daktilo efektini başlatır
        window.onload = function() {
            const titleEl = document.getElementById('text-title');
            const mottoEl = document.getElementById('text-motto');
            const bioEl = document.getElementById('text-bio');
            const linksEl = document.getElementById('text-links');
            const secTitleEl = document.getElementById('text-sectitle');
            const listEl = document.getElementById('text-list');

            typeEffect(titleEl, "Rümeysa Orhun", 70, function() {
                typeEffect(mottoEl, "CAN DO ANYTHING I WANT!", 50, function() {
                    typeEffect(bioEl, "yeah garamond is nice . i don't invest 😊", 40, function() {
                        showElementImmediately(linksEl, function() {
                            typeEffect(secTitleEl, "currently watching:", 50, function() {
                                showElementImmediately(listEl);
                            });
                        });
                    });
                });
            });
        };
    </script>

</body>
</html>
